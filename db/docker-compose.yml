services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: justicecongo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: justicecongo
      POSTGRES_PASSWORD: justicecongo_dev
      POSTGRES_DB: justicecongo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justicecongo -d justicecongo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
